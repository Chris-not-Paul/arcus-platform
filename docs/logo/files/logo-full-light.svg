<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="320" height="230">
  <title>ARCUS — Logo Full Light</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300&display=swap');
      .wm { font-family:'Raleway','Helvetica Neue',Arial,sans-serif; fill:#1A1612; font-weight:300; letter-spacing:12px; font-size:28px; }
      .tg { font-family:'Raleway','Helvetica Neue',Arial,sans-serif; fill:#8A7A60; font-size:8px; letter-spacing:4px; font-weight:300; }
    </style>
  </defs>
  <rect width="320" height="230" fill="#F5F0E8"/>
  <!-- Simbolo -->
  <g transform="translate(160,82) scale(0.62)">
    <polygon points="-65,68  0,-55  0,-36  -43,68" fill="#B8893A"/>
    <polygon points="0,-55  65,68  43,68  0,-36" fill="#B8893A"/>
    <rect x="-32" y="18" width="64" height="4" fill="#B8893A"/>
    <rect x="-65" y="62" width="130" height="6" rx="1" fill="#B8893A"/>
  </g>
  <!-- Wordmark con spazio netto sotto la A -->
  <text x="160" y="158" text-anchor="middle" class="wm">ARCUS</text>
  <!-- Separatore -->
  <line x1="56" y1="171" x2="148" y2="171" stroke="#C8B898" stroke-width="0.5"/>
  <circle cx="160" cy="171" r="1.5" fill="#B8893A"/>
  <line x1="172" y1="171" x2="264" y2="171" stroke="#C8B898" stroke-width="0.5"/>
  <!-- Tagline -->
  <text x="160" y="190" text-anchor="middle" class="tg">INFRASTRUCTURE INTELLIGENCE</text>
</svg>
