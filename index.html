  <body>
    <form
      name="arcus-evidence-contribution"
      method="POST"
      enctype="multipart/form-data"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input name="form-name" value="arcus-evidence-contribution" />
      <input name="bot-field" />
      <input name="language" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="affiliation" />
      <input name="expert_role" />
      <input name="orcid" />
      <input name="credit_preference" />
      <input name="target_type" />
      <input name="event_id" />
      <input name="bridge_name" />
      <input name="place" />
      <input name="event_date" />
      <input name="latitude" />
      <input name="longitude" />
      <input name="contribution_types" />
      <input name="evidence_basis" />
      <textarea name="summary"></textarea>
      <input name="source_availability" />
      <input name="source_url" />
      <input name="document_title" />
      <input name="document_issuer" />
      <input name="document_type" />
      <input name="document_date" />
      <input name="document_pages" />
      <input name="document_reference" />
      <input name="document_access_basis" />
      <input name="document_rights_confirmed" />
      <input name="document_attachment" type="file" />
      <input name="image_creator" />
      <input name="image_credit_line" />
      <input name="image_rights_basis" />
      <input name="image_source_url" />
      <input name="image_caption" />
      <input name="image_attachment" type="file" />
      <input name="terms_accepted" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
